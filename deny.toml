# This section is considered when running `cargo deny check advisories`
# More documentation for the advisories section can be found here:
# https://embarkstudios.github.io/cargo-deny/checks/advisories/cfg.html
[advisories]
version = 2
ignore = [
  # Each entry says what the issue is, whether it affects Walrus, and how to fix it. Remove an entry
  # once its fix lands.
  #
  # - Issue: Marvin timing attack on `rsa` private-key operations; no fixed release.
  # - Walrus: none. `rsa` comes in through `fastcrypto` and our `jsonwebtoken` (`rust_crypto`),
  #   and the publisher's JWT check only verifies signatures with public keys.
  # - Fix: a fixed `rsa` release.
  "RUSTSEC-2023-0071",
  # - Issue: `yaml-rust` is unmaintained; no known vulnerability.
  # - Walrus: through `serde_yaml` 0.8 in Sui crates such as `sui-config`, which read local config
  #   files.
  # - Fix: Sui moves off `serde_yaml` 0.8.
  "RUSTSEC-2024-0320",
  # - Issue: `proc-macro-error` is unmaintained; no known vulnerability.
  # - Walrus: none at runtime; it is a proc macro used by `tabled` 0.12 in `sui-json-rpc-types`.
  # - Fix: Sui upgrades `tabled`.
  "RUSTSEC-2024-0370",
  # - Issue: `instant` is unmaintained; no known vulnerability.
  # - Walrus: none; outside WebAssembly it only wraps `std::time`. It comes in through `backoff` in
  #   Sui crates and `parking_lot` 0.11 in the Move VM and `fastcrypto-tbls`.
  # - Fix: Sui and fastcrypto move off `backoff` and `parking_lot` 0.11.
  "RUSTSEC-2024-0384",
  # - Issue: `derivative` is unmaintained; no known vulnerability.
  # - Walrus: none at runtime; it is a proc macro used by `ark-*` 0.4 in `fastcrypto` and by
  #   `starlark` in `sui-config`.
  # - Fix: fastcrypto upgrades `ark-*` and Sui upgrades `starlark`.
  "RUSTSEC-2024-0388",
  # - Issue: `paste` is unmaintained; no known vulnerability.
  # - Walrus: none at runtime; it is a proc macro used by `ark-ff` 0.4 in `fastcrypto` and by
  #   `starlark` in `sui-config`.
  # - Fix: fastcrypto upgrades `ark-*` and Sui upgrades `starlark`.
  "RUSTSEC-2024-0436",
  # - Issue: `backoff` is unmaintained; no known vulnerability.
  # - Walrus: through Sui crates such as `typed-store` and `sui-storage`.
  # - Fix: Sui replaces `backoff`.
  "RUSTSEC-2025-0012",
  # - Issue: `fxhash` is unmaintained; no known vulnerability.
  # - Walrus: through `starlark` in `sui-config`.
  # - Fix: Sui upgrades or drops `starlark`.
  "RUSTSEC-2025-0057",
  # - Issue: `rustls-pemfile` is unmaintained; no known vulnerability.
  # - Walrus: `object_store` 0.11 (our backup and backfill code) uses it to read PEM keys from GCP
  #   credentials.
  # - Fix: `object_store` 0.14; see the `quick-xml` entry below.
  "RUSTSEC-2025-0134",
  # - Issue: `bincode` 1 is unmaintained; no known vulnerability and no fixed release.
  # - Walrus: our `typed-store` encodes RocksDB keys with it, and `anemo`, `fastcrypto`, `msim`, and
  #   Sui crates use it too.
  # - Fix: move our encoding to another crate, which changes the on-disk format; the others move
  #   too.
  "RUSTSEC-2025-0141",
  # - Issue: `unsafe-libyaml` is unmaintained; no known vulnerability.
  # - Walrus: our `serde_yaml` 0.9 uses it to parse config files, which operators control.
  # - Fix: replace `serde_yaml` with a maintained YAML crate such as `serde-saphyr`.
  "RUSTSEC-2024-0449",
  # - Issue: CPU and memory exhaustion in `quick-xml` < 0.41 on crafted XML.
  # - Walrus: `object_store` 0.11 (our backup and backfill code) and 0.13 (Sui crates) parse cloud
  #   storage API responses with it; exploiting this needs a malicious storage endpoint.
  # - Fix: `object_store` 0.14 here and in Sui. With only the `ring` backend, its `reqwest` 0.13
  #   client needs a rustls crypto provider installed at startup.
  "RUSTSEC-2026-0194",
  "RUSTSEC-2026-0195",
  # - Issue: `clear_on_drop` is unmaintained; no known vulnerability.
  # - Walrus: none; only `bulletproofs` in `fastcrypto` uses it, and Walrus doesn't use
  #   bulletproofs.
  # - Fix: fastcrypto drops or replaces `bulletproofs`.
  "RUSTSEC-2026-0283",
  # - Issue: unsound `tokio::io::unix::AsyncFd` constructors, fixed in 1.51.6 and 1.53.3.
  # - Walrus: none; no crate in our dependency tree calls them.
  # - Fix: mysten-sim moves to `tokio` 1.53.3 or later, then we update our `=1.52.1` pin, which
  #   matches the mysten-sim fork used by simtests.
  "RUSTSEC-2026-0386",
  # - Issue: timing side channels in `crypto-bigint` < 0.7.6 in operations meant to be
  #   constant-time.
  # - Walrus: through `elliptic-curve` 0.13 (`p256` 0.13 and `fastcrypto`) and 0.12 (`k256` 0.11
  #   in `sui-keys`). Our P-256 network key only signs in TLS, where rustls uses `ring`.
  # - Fix: fastcrypto and Sui move to the `p256` 0.14 line, then we upgrade `p256`, whose keys we
  #   convert from `fastcrypto`'s.
  "RUSTSEC-2026-0387",
  # - Issue: `zstd` < 0.14.3 and `zstd-safe` < 8.2.0 can leak data between streams on a reused
  #   context, overrun a `Vec` in `Seekable::decompress`, and expose stale memory when streaming
  #   decompression of a legacy frame fails.
  # - Walrus: none found. Our code only calls `zstd::decode_all`, which none of these affect, the
  #   `seekable` feature is off, and our servers add no `tower-http` decompression layer.
  # - Fix: `zstd` 0.14 here and in Sui crates, `tonic`, and `async-compression`.
  "RUSTSEC-2026-0391",
  "RUSTSEC-2026-0398",
  "RUSTSEC-2026-0403",
]


# This section is considered when running `cargo deny check licenses`
# More documentation for the licenses section can be found here:
# https://embarkstudios.github.io/cargo-deny/checks/licenses/cfg.html
[licenses]
version = 2
# List of explicitly allowed licenses
# See https://spdx.org/licenses/ for list of possible licenses
# [possible values: any SPDX 3.11 short identifier (+ optional exception)].
allow = [
  "0BSD",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0", # allowed by sui
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
# The confidence threshold for detecting a license from license text.
# The higher the value, the more closely the license text must be to the
# canonical license text of a valid SPDX license file.
# [possible values: any between 0.0 and 1.0].
confidence-threshold = 0.8

[licenses.private]
# If true, ignores workspace crates that aren't published, or are only
# published to private registries.
# To see how to mark a crate as unpublished (to the official registry),
# visit https://doc.rust-lang.org/cargo/reference/manifest.html#the-publish-field.
ignore = true

# This section is considered when running `cargo deny check bans`.
# More documentation about the 'bans' section can be found here:
# https://embarkstudios.github.io/cargo-deny/checks/bans/cfg.html
[bans]
# Lint level for when multiple versions of the same crate are detected
multiple-versions = "deny"
skip = [
  { name = "itertools", version = "<=12.1" },
  { name = "petgraph", version = "0.6.5" },
  { name = "synstructure", version = "0.12.6" },
]
skip-tree = [
  # Mysten's libraries pull in several conflicting repo versions.
  { name = "axum", depth = 4 },
  { name = "darling", depth = 2 },
  { name = "fastcrypto", depth = 4 },
  { name = "test-cluster", depth = 6 },
  { name = "typed-store", depth = 6 },
  # several crates depend on an older version of windows and windows-sys
  { name = "windows-sys", depth = 3, version = "0.48" },
]
deny = [
  # TODO: Remove the following three lines after removing SSH. (#221)
  { name = "libssh2-sys", wrappers = ["ssh2"] },
  { name = "openssl-sys", wrappers = ["libssh2-sys"] },
  { name = "ssh2", wrappers = ["walrus-orchestrator"] },
]

# This section is considered when running `cargo deny check sources`.
# More documentation about the 'sources' section can be found here:
# https://embarkstudios.github.io/cargo-deny/checks/sources/cfg.html
[sources]
# Lint level for what to happen when a crate from a crate registry that is not
# in the allow list is encountered
unknown-registry = "deny"
# Lint level for what to happen when a crate from a git repository that is not
# in the allow list is encountered
unknown-git = "deny"
allow-git = [
  "https://github.com/asonnino/prometheus-parser",
  "https://github.com/mystenmark/async-task",
  "https://github.com/zhiburt/tabled",
]

[sources.allow-org]
# github.com organizations to allow git sources for
github = [
  "MystenLabs",
]
