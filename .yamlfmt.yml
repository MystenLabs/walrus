exclude:
  - "crates/walrus-upload-relay/walrus_upload_relay_config_example.yaml" # autogenerated file
  - "crates/walrus-sdk/client_config_example.yaml" # autogenerated file
  - "crates/walrus-service/node_config_example.yaml" # autogenerated file (see unit test)
  - "crates/walrus-service/aggregator_openapi.yaml" # autogenerated file
  - "crates/walrus-service/daemon_openapi.yaml" # autogenerated file
  - "crates/walrus-service/publisher_openapi.yaml" # autogenerated file
  - "crates/walrus-service/storage_openapi.yaml" # autogenerated file
  - "crates/walrus-upload-relay/upload_relay_openapi.yaml" # autogenerated file
  - "crates/walrus-service/node_config_example.yaml" # autogenerated file
  - "docs/site/pnpm-lock.yaml" # autogenerated file; pnpm reverts the explicit-key form yamlfmt writes
  - "docs/site/static/setup/client_config_example.yaml" # symlink to the autogenerated SDK example
  - ".github/workflows/trigger-artifacts-builds.yml" # yamlfmt wraps a ${{ }} expression in the payload
gitignore_excludes: true
formatter:
  type: basic
  retain_line_breaks_single: true
  scan_folded_as_literal: true
  max_line_length: 120
  drop_merge_tag: true
  disable_alias_key_correction: true
