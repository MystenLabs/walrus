<?xml version="1.0" encoding="UTF-8"?>
<svg width="880" height="400" viewBox="0 0 880 400" role="img" xmlns="http://www.w3.org/2000/svg" data-c4-level="L4" style="background: rgb(0, 0, 0); font-family: Inter, &quot;Inter Tight&quot;, system-ui, sans-serif; max-width: 100%; height: auto;"><title>The life of a Walrus blob</title><desc>A client buys a storage resource on Sui for a number of epochs, registers the blob, erasure-codes it into slivers, distributes them to the storage node committee, collects signed confirmations from a write quorum of 2f + 1 nodes, and posts the availability certificate to Sui. The blob is then guaranteed retrievable for the purchased storage period, after which it must be extended or it expires and the space is reclaimed.</desc><text x="12" y="38" font-size="13" font-family="var(--walrus-font-diagram)" fill="#8A8A93">Storing the blob</text><g style="opacity: 1; transition: opacity 0.3s;"><g><rect x="12" y="56" width="122" height="56" fill="#98EFDD"></rect><text x="73" y="79.52" fill="#000000" text-anchor="middle" dominant-baseline="central" font-family="Inter, &quot;Inter Tight&quot;, system-ui, sans-serif" font-size="14" font-weight="500" letter-spacing="0.5">ACQUIRE</text><text x="73" y="96.32" fill="#000000" text-anchor="middle" dominant-baseline="central" font-family="Inter, &quot;Inter Tight&quot;, system-ui, sans-serif" font-size="12">buy epochs (Sui)</text></g></g><g style="opacity: 1; transition: opacity 0.3s;"><g><rect x="158.8" y="56" width="122" height="56" fill="#98EFDD"></rect><text x="219.8" y="79.52" fill="#000000" text-anchor="middle" dominant-baseline="central" font-family="Inter, &quot;Inter Tight&quot;, system-ui, sans-serif" font-size="14" font-weight="500" letter-spacing="0.5">REGISTER</text><text x="219.8" y="96.32" fill="#000000" text-anchor="middle" dominant-baseline="central" font-family="Inter, &quot;Inter Tight&quot;, system-ui, sans-serif" font-size="12">blob object (Sui)</text></g></g><g style="opacity: 1; transition: opacity 0.3s;"><g><rect x="305.6" y="56" width="122" height="56" fill="#CAB1FF"></rect><text x="366.6" y="79.52" fill="#000000" text-anchor="middle" dominant-baseline="central" font-family="Inter, &quot;Inter Tight&quot;, system-ui, sans-serif" font-size="14" font-weight="500" letter-spacing="0.5">ENCODE</text><text x="366.6" y="96.32" fill="#000000" text-anchor="middle" dominant-baseline="central" font-family="Inter, &quot;Inter Tight&quot;, system-ui, sans-serif" font-size="12">RedStuff slivers</text></g></g><g style="opacity: 1; transition: opacity 0.3s;"><g><rect x="452.40000000000003" y="56" width="122" height="56" fill="#CAB1FF"></rect><text x="513.4000000000001" y="79.52" fill="#000000" text-anchor="middle" dominant-baseline="central" font-family="Inter, &quot;Inter Tight&quot;, system-ui, sans-serif" font-size="14" font-weight="500" letter-spacing="0.5">DISTRIBUTE</text><text x="513.4000000000001" y="96.32" fill="#000000" text-anchor="middle" dominant-baseline="central" font-family="Inter, &quot;Inter Tight&quot;, system-ui, sans-serif" font-size="12">to committee</text></g></g><g style="opacity: 1; transition: opacity 0.3s;"><g><rect x="599.2" y="56" width="122" height="56" fill="#CAB1FF"></rect><text x="660.2" y="79.52" fill="#000000" text-anchor="middle" dominant-baseline="central" font-family="Inter, &quot;Inter Tight&quot;, system-ui, sans-serif" font-size="14" font-weight="500" letter-spacing="0.5">QUORUM</text><text x="660.2" y="96.32" fill="#000000" text-anchor="middle" dominant-baseline="central" font-family="Inter, &quot;Inter Tight&quot;, system-ui, sans-serif" font-size="12">2f + 1 signatures</text></g></g><g style="opacity: 1; transition: opacity 0.3s;"><g><rect x="746" y="56" width="122" height="56" fill="#98EFDD"></rect><text x="807" y="79.52" fill="#000000" text-anchor="middle" dominant-baseline="central" font-family="Inter, &quot;Inter Tight&quot;, system-ui, sans-serif" font-size="14" font-weight="500" letter-spacing="0.5">CERTIFY</text><text x="807" y="96.32" fill="#000000" text-anchor="middle" dominant-baseline="central" font-family="Inter, &quot;Inter Tight&quot;, system-ui, sans-serif" font-size="12">certificate (Sui)</text></g></g><g style="opacity: 1; transition: opacity 0.3s;"><g><defs><marker id="wal-sync-r0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#98EFDD"></path></marker></defs><line x1="134" y1="90" x2="158.8" y2="90" stroke="#98EFDD" stroke-width="1.5" marker-end="url(#wal-sync-r0)"></line></g></g><g style="opacity: 1; transition: opacity 0.3s;"><g><defs><marker id="wal-sync-r1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#98EFDD"></path></marker></defs><line x1="280.8" y1="90" x2="305.6" y2="90" stroke="#98EFDD" stroke-width="1.5" marker-end="url(#wal-sync-r1)"></line></g></g><g style="opacity: 1; transition: opacity 0.3s;"><g><defs><marker id="wal-sync-r2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#98EFDD"></path></marker></defs><line x1="427.6" y1="90" x2="452.40000000000003" y2="90" stroke="#98EFDD" stroke-width="1.5" marker-end="url(#wal-sync-r2)"></line></g></g><g style="opacity: 1; transition: opacity 0.3s;"><g><defs><marker id="wal-sync-r3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#98EFDD"></path></marker></defs><line x1="574.4000000000001" y1="90" x2="599.2" y2="90" stroke="#98EFDD" stroke-width="1.5" marker-end="url(#wal-sync-r3)"></line></g></g><g style="opacity: 1; transition: opacity 0.3s;"><g><defs><marker id="wal-sync-r4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#98EFDD"></path></marker></defs><line x1="721.2" y1="90" x2="746" y2="90" stroke="#98EFDD" stroke-width="1.5" marker-end="url(#wal-sync-r4)"></line></g></g><text x="12" y="200" font-size="13" font-family="var(--walrus-font-diagram)" fill="#8A8A93">The blob is live</text><g style="opacity: 1; transition: opacity 0.3s;"><g><defs><marker id="wal-sync-r5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#98EFDD"></path></marker></defs><line x1="807" y1="124" x2="807" y2="212" stroke="#98EFDD" stroke-width="1.5" marker-end="url(#wal-sync-r5)"></line></g><g><rect x="12" y="218" width="856" height="20" fill="#613DFF"></rect><text x="440" y="228" fill="#FAF8F5" text-anchor="middle" dominant-baseline="central" font-family="Inter, &quot;Inter Tight&quot;, system-ui, sans-serif" font-size="12" font-weight="500" letter-spacing="0.5">CERTIFIED AND AVAILABLE FOR THE PURCHASED STORAGE PERIOD</text></g></g><g style="opacity: 1; transition: opacity 0.3s;"><g><defs><marker id="wal-sync-r6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#98EFDD"></path></marker></defs><line x1="300" y1="232" x2="300" y2="292" stroke="#98EFDD" stroke-width="1.5" marker-end="url(#wal-sync-r6)"></line></g><g><rect x="210" y="292" width="180" height="56" fill="#613DFF"></rect><text x="300" y="315.52" fill="#FAF8F5" text-anchor="middle" dominant-baseline="central" font-family="Inter, &quot;Inter Tight&quot;, system-ui, sans-serif" font-size="14" font-weight="500" letter-spacing="0.5">EXTEND</text><text x="300" y="332.32" fill="#98EFDD" text-anchor="middle" dominant-baseline="central" font-family="Inter, &quot;Inter Tight&quot;, system-ui, sans-serif" font-size="12">buy more epochs</text></g><g><defs><marker id="wal-async-r7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#98EFDD" stroke-width="1.5"></path></marker></defs><line x1="620" y1="232" x2="620" y2="292" stroke="#98EFDD" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#wal-async-r7)"></line></g><g><rect x="530" y="292" width="180" height="56" fill="#CAB1FF"></rect><text x="620" y="315.52" fill="#000000" text-anchor="middle" dominant-baseline="central" font-family="Inter, &quot;Inter Tight&quot;, system-ui, sans-serif" font-size="14" font-weight="500" letter-spacing="0.5">EXPIRE</text><text x="620" y="332.32" fill="#000000" text-anchor="middle" dominant-baseline="central" font-family="Inter, &quot;Inter Tight&quot;, system-ui, sans-serif" font-size="12">space reclaimed</text></g></g></svg>
