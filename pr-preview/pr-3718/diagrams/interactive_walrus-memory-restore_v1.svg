<svg width="840" height="400" viewBox="0 0 840 400" role="img" xmlns="http://www.w3.org/2000/svg" data-c4-level="L4" style="background: rgb(0, 0, 0); font-family: Inter, &quot;Inter Tight&quot;, system-ui, sans-serif; max-width: 100%; height: auto;"><title>Restore</title><desc>The durable Seal-encrypted blobs on Walrus are re-read and re-indexed to rebuild the pgvector search cache. The index is derived and the blobs are the source of truth.</desc><g style="opacity: 1; transition: opacity 0.3s;"><g><g><rect x="90" y="176" width="40" height="10" rx="1" fill="none" stroke="#98EFDD" stroke-width="1"></rect><circle cx="95" cy="181" r="1" fill="#98EFDD"></circle><circle cx="99" cy="181" r="1" fill="#CAB1FF"></circle></g><g><rect x="90" y="190" width="40" height="10" rx="1" fill="none" stroke="#98EFDD" stroke-width="1"></rect><circle cx="95" cy="195" r="1" fill="#98EFDD"></circle><circle cx="99" cy="195" r="1" fill="#98EFDD"></circle></g><g><rect x="90" y="204" width="40" height="10" rx="1" fill="none" stroke="#98EFDD" stroke-width="1"></rect><circle cx="95" cy="209" r="1" fill="#98EFDD"></circle><circle cx="99" cy="209" r="1" fill="#CAB1FF"></circle></g><text x="110" y="240" fill="#FAF8F5" text-anchor="middle" font-family="Inter, &quot;Inter Tight&quot;, system-ui, sans-serif" font-size="12">Walrus blobs</text></g></g><g style="opacity: 1; transition: opacity 0.3s;"><g><rect x="280" y="162" width="126" height="56" fill="#98EFDD"></rect><text x="343" y="185.52" fill="#000000" text-anchor="middle" dominant-baseline="central" font-family="Inter, &quot;Inter Tight&quot;, system-ui, sans-serif" font-size="14" font-weight="500" letter-spacing="0.5">SEAL</text><text x="343" y="202.32" fill="#000000" text-anchor="middle" dominant-baseline="central" font-family="Inter, &quot;Inter Tight&quot;, system-ui, sans-serif" font-size="12">decrypt</text></g></g><g style="opacity: 1; transition: opacity 0.3s;"><g><rect x="470" y="162" width="132" height="56" fill="#CAB1FF"></rect><text x="536" y="185.52" fill="#000000" text-anchor="middle" dominant-baseline="central" font-family="Inter, &quot;Inter Tight&quot;, system-ui, sans-serif" font-size="14" font-weight="500" letter-spacing="0.5">RE-EMBED</text><text x="536" y="202.32" fill="#000000" text-anchor="middle" dominant-baseline="central" font-family="Inter, &quot;Inter Tight&quot;, system-ui, sans-serif" font-size="12">rebuild vectors</text></g></g><g style="opacity: 1; transition: opacity 0.3s;"><g><g><rect x="710.6666666666666" y="175.66666666666666" width="38.666666666666664" height="9.666666666666666" rx="0.9666666666666667" fill="none" stroke="#98EFDD" stroke-width="0.9666666666666667"></rect><circle cx="715.5" cy="180.5" r="0.9666666666666667" fill="#98EFDD"></circle><circle cx="719.3666666666667" cy="180.5" r="0.9666666666666667" fill="#CAB1FF"></circle></g><g><rect x="710.6666666666666" y="189.2" width="38.666666666666664" height="9.666666666666666" rx="0.9666666666666667" fill="none" stroke="#98EFDD" stroke-width="0.9666666666666667"></rect><circle cx="715.5" cy="194.03333333333333" r="0.9666666666666667" fill="#98EFDD"></circle><circle cx="719.3666666666667" cy="194.03333333333333" r="0.9666666666666667" fill="#98EFDD"></circle></g><g><rect x="710.6666666666666" y="202.73333333333335" width="38.666666666666664" height="9.666666666666666" rx="0.9666666666666667" fill="none" stroke="#98EFDD" stroke-width="0.9666666666666667"></rect><circle cx="715.5" cy="207.56666666666666" r="0.9666666666666667" fill="#98EFDD"></circle><circle cx="719.3666666666667" cy="207.56666666666666" r="0.9666666666666667" fill="#CAB1FF"></circle></g><text x="730" y="238" fill="#FAF8F5" text-anchor="middle" font-family="Inter, &quot;Inter Tight&quot;, system-ui, sans-serif" font-size="12">pgvector index</text></g></g><g style="opacity: 1; transition: opacity 0.3s;"><g><defs><marker id="wal-sync-r0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#98EFDD"></path></marker></defs><line x1="140" y1="196" x2="280" y2="196" stroke="#98EFDD" stroke-width="1.5" marker-end="url(#wal-sync-r0)"></line><text x="210" y="188" fill="#98EFDD" text-anchor="middle" stroke="#000000" stroke-width="4" stroke-linejoin="round" paint-order="stroke" font-family="Inter, &quot;Inter Tight&quot;, system-ui, sans-serif" font-size="12">ciphertext</text></g></g><g style="opacity: 1; transition: opacity 0.3s;"><g><defs><marker id="wal-sync-r1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#98EFDD"></path></marker></defs><line x1="406" y1="196" x2="470" y2="196" stroke="#98EFDD" stroke-width="1.5" marker-end="url(#wal-sync-r1)"></line></g></g><g style="opacity: 1; transition: opacity 0.3s;"><g><defs><marker id="wal-async-r2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#98EFDD" stroke-width="1.5"></path></marker></defs><line x1="602" y1="196" x2="701" y2="196" stroke="#98EFDD" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#wal-async-r2)"></line><text x="651.5" y="188" fill="#98EFDD" text-anchor="middle" stroke="#000000" stroke-width="4" stroke-linejoin="round" paint-order="stroke" font-family="Inter, &quot;Inter Tight&quot;, system-ui, sans-serif" font-size="12">re-indexed</text></g></g><g><circle r="3.4" fill="#16D6C4" opacity="0.9"><animateMotion dur="1.5s" begin="0s" repeatCount="indefinite" path="M602 196 L701 196"></animateMotion><animate attributeName="opacity" dur="1.5s" begin="0s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.1;0.85;1"></animate></circle><circle r="3.4" fill="#16D6C4" opacity="0.9"><animateMotion dur="1.5s" begin="0.5s" repeatCount="indefinite" path="M602 196 L701 196"></animateMotion><animate attributeName="opacity" dur="1.5s" begin="0.5s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.1;0.85;1"></animate></circle><circle r="3.4" fill="#16D6C4" opacity="0.9"><animateMotion dur="1.5s" begin="1s" repeatCount="indefinite" path="M602 196 L701 196"></animateMotion><animate attributeName="opacity" dur="1.5s" begin="1s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.1;0.85;1"></animate></circle></g></svg>
