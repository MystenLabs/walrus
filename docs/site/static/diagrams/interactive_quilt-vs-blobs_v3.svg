<svg width="880" height="470" viewBox="0 0 880 470" role="img" xmlns="http://www.w3.org/2000/svg" data-c4-level="L3" style="background: rgb(0, 0, 0); font-family: Inter, &quot;Inter Tight&quot;, system-ui, sans-serif; max-width: 100%; height: auto;"><title>Batch storage with Quilt</title><desc>Six small files stored as six separate Walrus blobs each carry the fixed 64 MB per-blob metadata charge and their own onchain registration, totalling 384 MB of metadata. The same six files packed into one quilt pay the 64 MB charge once and register once, and each file remains individually retrievable as a patch by its identifier.</desc><text x="24" y="66" font-size="13" font-family="var(--walrus-font-diagram)" fill="#8A8A93">Without a quilt</text><g style="opacity: 1; transition: opacity 0.3s;"><g><rect x="24" y="95" width="34" height="34" fill="#613DFF" stroke="none" stroke-width="0" style="animation: 0.25s ease 0s 1 normal both running pop;"></rect><rect x="64" y="95" width="34" height="34" fill="#613DFF" stroke="none" stroke-width="0" style="animation: 0.25s ease 0.04s 1 normal both running pop;"></rect><rect x="104" y="95" width="34" height="34" fill="#613DFF" stroke="none" stroke-width="0" style="animation: 0.25s ease 0.08s 1 normal both running pop;"></rect><rect x="24" y="135" width="34" height="34" fill="#613DFF" stroke="none" stroke-width="0" style="animation: 0.25s ease 0.12s 1 normal both running pop;"></rect><rect x="64" y="135" width="34" height="34" fill="#613DFF" stroke="none" stroke-width="0" style="animation: 0.25s ease 0.16s 1 normal both running pop;"></rect><rect x="104" y="135" width="34" height="34" fill="#613DFF" stroke="none" stroke-width="0" style="animation: 0.25s ease 0.2s 1 normal both running pop;"></rect></g></g><g style="opacity: 1; transition: opacity 0.3s;"><g><defs><marker id="wal-sync-r0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#98EFDD"></path></marker></defs><line x1="138" y1="132" x2="200" y2="132" stroke="#98EFDD" stroke-width="1.5" marker-end="url(#wal-sync-r0)"></line></g></g><g style="opacity: 1; transition: opacity 0.3s;"><g><rect x="204" y="95" width="34" height="34" fill="#CAB1FF" stroke="none" stroke-width="0" style="animation: 0.25s ease 0s 1 normal both running pop;"></rect><rect x="244" y="95" width="34" height="34" fill="#CAB1FF" stroke="none" stroke-width="0" style="animation: 0.25s ease 0.04s 1 normal both running pop;"></rect><rect x="284" y="95" width="34" height="34" fill="#CAB1FF" stroke="none" stroke-width="0" style="animation: 0.25s ease 0.08s 1 normal both running pop;"></rect><rect x="204" y="135" width="34" height="34" fill="#CAB1FF" stroke="none" stroke-width="0" style="animation: 0.25s ease 0.12s 1 normal both running pop;"></rect><rect x="244" y="135" width="34" height="34" fill="#CAB1FF" stroke="none" stroke-width="0" style="animation: 0.25s ease 0.16s 1 normal both running pop;"></rect><rect x="284" y="135" width="34" height="34" fill="#CAB1FF" stroke="none" stroke-width="0" style="animation: 0.25s ease 0.2s 1 normal both running pop;"></rect></g></g><g style="opacity: 1; transition: opacity 0.3s;"><g><defs><marker id="wal-sync-r1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#98EFDD"></path></marker></defs><line x1="318" y1="132" x2="386" y2="132" stroke="#98EFDD" stroke-width="1.5" marker-end="url(#wal-sync-r1)"></line><text x="352" y="124" fill="#98EFDD" text-anchor="middle" stroke="#000000" stroke-width="4" stroke-linejoin="round" paint-order="stroke" font-family="Inter, &quot;Inter Tight&quot;, system-ui, sans-serif" font-size="12">register</text></g></g><g style="opacity: 1; transition: opacity 0.3s;"><g><rect x="396" y="100" width="170" height="56" fill="#98EFDD"></rect><text x="481" y="123.52" fill="#000000" text-anchor="middle" dominant-baseline="central" font-family="Inter, &quot;Inter Tight&quot;, system-ui, sans-serif" font-size="14" font-weight="500" letter-spacing="0.5">SUI</text><text x="481" y="140.32" fill="#000000" text-anchor="middle" dominant-baseline="central" font-family="Inter, &quot;Inter Tight&quot;, system-ui, sans-serif" font-size="12">6 blob objects</text></g></g><g style="opacity: 1; transition: opacity 0.3s;"><text x="594" y="130" font-size="25" font-family="var(--walrus-font-mono)" fill="#CAB1FF">6 × 64 MB</text><text x="594" y="154" font-size="13" font-family="var(--walrus-font-diagram)" fill="#8A8A93">384 MB metadata</text></g><text x="24" y="244" font-size="13" font-family="var(--walrus-font-diagram)" fill="#8A8A93">With a quilt</text><g style="opacity: 1; transition: opacity 0.3s;"><g><rect x="24" y="285" width="34" height="34" fill="#613DFF" stroke="none" stroke-width="0" style="animation: 0.25s ease 0s 1 normal both running pop;"></rect><rect x="64" y="285" width="34" height="34" fill="#613DFF" stroke="none" stroke-width="0" style="animation: 0.25s ease 0.04s 1 normal both running pop;"></rect><rect x="104" y="285" width="34" height="34" fill="#613DFF" stroke="none" stroke-width="0" style="animation: 0.25s ease 0.08s 1 normal both running pop;"></rect><rect x="24" y="325" width="34" height="34" fill="#613DFF" stroke="none" stroke-width="0" style="animation: 0.25s ease 0.12s 1 normal both running pop;"></rect><rect x="64" y="325" width="34" height="34" fill="#613DFF" stroke="none" stroke-width="0" style="animation: 0.25s ease 0.16s 1 normal both running pop;"></rect><rect x="104" y="325" width="34" height="34" fill="#613DFF" stroke="none" stroke-width="0" style="animation: 0.25s ease 0.2s 1 normal both running pop;"></rect></g></g><g style="opacity: 1; transition: opacity 0.3s;"><g><defs><marker id="wal-sync-r2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#98EFDD"></path></marker></defs><line x1="138" y1="322" x2="196" y2="322" stroke="#98EFDD" stroke-width="1.5" marker-end="url(#wal-sync-r2)"></line></g></g><g style="opacity: 1; transition: opacity 0.3s;"><g><text x="196" y="256" fill="#FAF8F5" font-family="Inter, &quot;Inter Tight&quot;, system-ui, sans-serif" font-size="12">One quilt blob</text><rect x="196" y="264" width="134" height="116" fill="none" stroke="#CAB1FF" stroke-width="1"></rect></g></g><g style="opacity: 1; transition: opacity 0.3s;"><g><rect x="210" y="289" width="30" height="30" fill="#98EFDD" stroke="none" stroke-width="0" style="animation: 0.25s ease 0s 1 normal both running pop;"></rect><rect x="246" y="289" width="30" height="30" fill="#98EFDD" stroke="none" stroke-width="0" style="animation: 0.25s ease 0.04s 1 normal both running pop;"></rect><rect x="282" y="289" width="30" height="30" fill="#98EFDD" stroke="none" stroke-width="0" style="animation: 0.25s ease 0.08s 1 normal both running pop;"></rect><rect x="210" y="325" width="30" height="30" fill="#98EFDD" stroke="none" stroke-width="0" style="animation: 0.25s ease 0.12s 1 normal both running pop;"></rect><rect x="246" y="325" width="30" height="30" fill="#98EFDD" stroke="none" stroke-width="0" style="animation: 0.25s ease 0.16s 1 normal both running pop;"></rect><rect x="282" y="325" width="30" height="30" fill="#98EFDD" stroke="none" stroke-width="0" style="animation: 0.25s ease 0.2s 1 normal both running pop;"></rect></g></g><g style="opacity: 1; transition: opacity 0.3s;"><g><defs><marker id="wal-sync-r3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#98EFDD"></path></marker></defs><line x1="330" y1="322" x2="386" y2="322" stroke="#98EFDD" stroke-width="1.5" marker-end="url(#wal-sync-r3)"></line><text x="358" y="314" fill="#98EFDD" text-anchor="middle" stroke="#000000" stroke-width="4" stroke-linejoin="round" paint-order="stroke" font-family="Inter, &quot;Inter Tight&quot;, system-ui, sans-serif" font-size="12">register</text></g></g><g style="opacity: 1; transition: opacity 0.3s;"><g><rect x="396" y="290" width="170" height="56" fill="#98EFDD"></rect><text x="481" y="313.52" fill="#000000" text-anchor="middle" dominant-baseline="central" font-family="Inter, &quot;Inter Tight&quot;, system-ui, sans-serif" font-size="14" font-weight="500" letter-spacing="0.5">SUI</text><text x="481" y="330.32" fill="#000000" text-anchor="middle" dominant-baseline="central" font-family="Inter, &quot;Inter Tight&quot;, system-ui, sans-serif" font-size="12">1 quilt object</text></g></g><g style="opacity: 1; transition: opacity 0.3s;"><text x="594" y="320" font-size="25" font-family="var(--walrus-font-mono)" fill="#98EFDD">1 × 64 MB</text><text x="594" y="344" font-size="13" font-family="var(--walrus-font-diagram)" fill="#8A8A93">64 MB metadata</text></g></svg>
