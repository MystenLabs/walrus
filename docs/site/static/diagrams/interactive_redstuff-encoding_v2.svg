<?xml version="1.0" encoding="UTF-8"?>
<svg width="840" height="342" viewBox="0 0 840 342" role="img" xmlns="http://www.w3.org/2000/svg" data-c4-level="L4" style="background: rgb(0, 0, 0); font-family: Inter, &quot;Inter Tight&quot;, system-ui, sans-serif; max-width: 100%; height: auto;"><title>RedStuff encoding and failure simulation</title><desc>A blob is encoded by RedStuff, a two-dimensional erasure code, into slivers held by n = 3f+1 = 7 storage nodes with f = 2. Any f+1 = 3 honest shards reconstruct the blob, so the committee tolerates up to 2f = 4 node failures when the remaining shards are honest. The billed storage is a constant 4.5 times the blob size plus a fixed 64 MB metadata term, while full replication would cost 7 times the blob size.</desc><g><rect x="345" y="20" width="150" height="56" fill="#613DFF"></rect><text x="420" y="43.519999999999996" fill="#FAF8F5" text-anchor="middle" dominant-baseline="central" font-family="Inter, &quot;Inter Tight&quot;, system-ui, sans-serif" font-size="14" font-weight="500" letter-spacing="0.5">BLOB</text><text x="420" y="60.32" fill="#98EFDD" text-anchor="middle" dominant-baseline="central" font-family="Inter, &quot;Inter Tight&quot;, system-ui, sans-serif" font-size="12">your data</text></g><g><defs><marker id="wal-sync-r0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#98EFDD"></path></marker></defs><line x1="420" y1="88" x2="420" y2="122" stroke="#98EFDD" stroke-width="1.5" marker-end="url(#wal-sync-r0)"></line></g><g><rect x="330" y="122" width="180" height="56" fill="#CAB1FF"></rect><text x="420" y="145.52" fill="#000000" text-anchor="middle" dominant-baseline="central" font-family="Inter, &quot;Inter Tight&quot;, system-ui, sans-serif" font-size="14" font-weight="500" letter-spacing="0.5">REDSTUFF ENCODE</text><text x="420" y="162.32" fill="#000000" text-anchor="middle" dominant-baseline="central" font-family="Inter, &quot;Inter Tight&quot;, system-ui, sans-serif" font-size="12">2D erasure code</text></g><g><defs><marker id="wal-sync-r1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#98EFDD"></path></marker></defs><line x1="420" y1="190" x2="420" y2="218" stroke="#98EFDD" stroke-width="1.5" marker-end="url(#wal-sync-r1)"></line><text x="420" y="196" fill="#98EFDD" text-anchor="middle" stroke="#000000" stroke-width="4" stroke-linejoin="round" paint-order="stroke" font-family="Inter, &quot;Inter Tight&quot;, system-ui, sans-serif" font-size="12">slivers</text></g><g class="clickable" style="animation: 0.3s ease 0s 1 normal both running pop;"><rect x="131" y="224" width="74" height="74" fill="#98EFDD" stroke="#16D6C4" stroke-width="3" stroke-dasharray="0"></rect><text x="168" y="266" text-anchor="middle" font-size="13" font-family="var(--walrus-font-mono)" fill="#0c0a15">1</text></g><g class="clickable" style="animation: 0.3s ease 0.03s 1 normal both running pop;"><rect x="215" y="224" width="74" height="74" fill="#98EFDD" stroke="#16D6C4" stroke-width="3" stroke-dasharray="0"></rect><text x="252" y="266" text-anchor="middle" font-size="13" font-family="var(--walrus-font-mono)" fill="#0c0a15">2</text></g><g class="clickable" style="animation: 0.3s ease 0.06s 1 normal both running pop;"><rect x="299" y="224" width="74" height="74" fill="#98EFDD" stroke="#16D6C4" stroke-width="3" stroke-dasharray="0"></rect><text x="336" y="266" text-anchor="middle" font-size="13" font-family="var(--walrus-font-mono)" fill="#0c0a15">3</text></g><g class="clickable" style="animation: 0.3s ease 0.09s 1 normal both running pop;"><rect x="383" y="224" width="74" height="74" fill="#98EFDD" stroke="none" stroke-width="0" stroke-dasharray="0"></rect><text x="420" y="266" text-anchor="middle" font-size="13" font-family="var(--walrus-font-mono)" fill="#0c0a15">4</text></g><g class="clickable" style="animation: 0.3s ease 0.12s 1 normal both running pop;"><rect x="467" y="224" width="74" height="74" fill="#98EFDD" stroke="none" stroke-width="0" stroke-dasharray="0"></rect><text x="504" y="266" text-anchor="middle" font-size="13" font-family="var(--walrus-font-mono)" fill="#0c0a15">5</text></g><g class="clickable" style="animation: 0.3s ease 0.15s 1 normal both running pop;"><rect x="551" y="224" width="74" height="74" fill="#98EFDD" stroke="none" stroke-width="0" stroke-dasharray="0"></rect><text x="588" y="266" text-anchor="middle" font-size="13" font-family="var(--walrus-font-mono)" fill="#0c0a15">6</text></g><g class="clickable" style="animation: 0.3s ease 0.18s 1 normal both running pop;"><rect x="635" y="224" width="74" height="74" fill="#98EFDD" stroke="none" stroke-width="0" stroke-dasharray="0"></rect><text x="672" y="266" text-anchor="middle" font-size="13" font-family="var(--walrus-font-mono)" fill="#0c0a15">7</text></g><text x="131" y="326" font-size="12" font-family="var(--walrus-font-diagram)" fill="#8A8A93">n = 3f + 1 = 7 shards, one per storage node</text></svg>
