<svg width="880" height="320" viewBox="0 0 880 320" role="img" xmlns="http://www.w3.org/2000/svg" data-c4-level="L2" style="background: rgb(0, 0, 0); font-family: Inter, &quot;Inter Tight&quot;, system-ui, sans-serif; max-width: 100%; height: auto;"><title>Walrus Memory trust boundary: Manual client flow</title><desc>Deployment model Manual client flow. You encrypt with Seal on your own client and compute vectors locally, so only ciphertext and precomputed vectors reach Walrus. This is the only mode where no other party handles your plaintext. Sui enforces ownership and delegate rules for the stored blobs.</desc><g><text x="16" y="60" fill="#FAF8F5" font-family="Inter, &quot;Inter Tight&quot;, system-ui, sans-serif" font-size="12">Your control · trusted</text><rect x="16" y="68" width="488" height="225" fill="none" stroke="#CAB1FF" stroke-width="1"></rect></g><g><text x="524" y="60" fill="#FAF8F5" font-family="Inter, &quot;Inter Tight&quot;, system-ui, sans-serif" font-size="12">Public network · untrusted</text><rect x="524" y="68" width="338" height="225" fill="none" stroke="#CAB1FF" stroke-width="1"></rect></g><g><rect x="36" y="84" width="126" height="56" fill="#613DFF"></rect><text x="99" y="107.52" fill="#FAF8F5" text-anchor="middle" dominant-baseline="central" font-family="Inter, &quot;Inter Tight&quot;, system-ui, sans-serif" font-size="14" font-weight="500" letter-spacing="0.5">CLIENT</text><text x="99" y="124.32" fill="#98EFDD" text-anchor="middle" dominant-baseline="central" font-family="Inter, &quot;Inter Tight&quot;, system-ui, sans-serif" font-size="12">plaintext + keys</text></g><g><rect x="288" y="84" width="190" height="56" fill="#98EFDD"></rect><text x="383" y="107.52" fill="#000000" text-anchor="middle" dominant-baseline="central" font-family="Inter, &quot;Inter Tight&quot;, system-ui, sans-serif" font-size="14" font-weight="500" letter-spacing="0.5">SEAL</text><text x="383" y="124.32" fill="#000000" text-anchor="middle" dominant-baseline="central" font-family="Inter, &quot;Inter Tight&quot;, system-ui, sans-serif" font-size="12">encrypt on client</text></g><g><g><rect x="672" y="100" width="36" height="9" rx="0.9" fill="none" stroke="#98EFDD" stroke-width="0.9"></rect><circle cx="676.5" cy="104.5" r="0.9" fill="#98EFDD"></circle><circle cx="680.1" cy="104.5" r="0.9" fill="#CAB1FF"></circle></g><g><rect x="672" y="112.6" width="36" height="9" rx="0.9" fill="none" stroke="#98EFDD" stroke-width="0.9"></rect><circle cx="676.5" cy="117.1" r="0.9" fill="#98EFDD"></circle><circle cx="680.1" cy="117.1" r="0.9" fill="#98EFDD"></circle></g><g><rect x="672" y="125.2" width="36" height="9" rx="0.9" fill="none" stroke="#98EFDD" stroke-width="0.9"></rect><circle cx="676.5" cy="129.7" r="0.9" fill="#98EFDD"></circle><circle cx="680.1" cy="129.7" r="0.9" fill="#CAB1FF"></circle></g><text x="690" y="159" fill="#FAF8F5" text-anchor="middle" font-family="Inter, &quot;Inter Tight&quot;, system-ui, sans-serif" font-size="12">Walrus blobs</text></g><g><rect x="620" y="208" width="140" height="56" fill="#98EFDD"></rect><text x="690" y="231.52" fill="#000000" text-anchor="middle" dominant-baseline="central" font-family="Inter, &quot;Inter Tight&quot;, system-ui, sans-serif" font-size="14" font-weight="500" letter-spacing="0.5">SUI</text><text x="690" y="248.32" fill="#000000" text-anchor="middle" dominant-baseline="central" font-family="Inter, &quot;Inter Tight&quot;, system-ui, sans-serif" font-size="12">ownership + delegates</text></g><g><defs><marker id="wal-sync-r0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#98EFDD"></path></marker></defs><line x1="162" y1="118" x2="288" y2="118" stroke="#98EFDD" stroke-width="1.5" marker-end="url(#wal-sync-r0)"></line><text x="225" y="110" fill="#98EFDD" text-anchor="middle" stroke="#000000" stroke-width="4" stroke-linejoin="round" paint-order="stroke" font-family="Inter, &quot;Inter Tight&quot;, system-ui, sans-serif" font-size="12">plaintext</text></g><g><defs><marker id="wal-sync-r1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#98EFDD"></path></marker></defs><line x1="478" y1="118" x2="657" y2="118" stroke="#98EFDD" stroke-width="1.5" marker-end="url(#wal-sync-r1)"></line><text x="567.5" y="110" fill="#98EFDD" text-anchor="middle" stroke="#000000" stroke-width="4" stroke-linejoin="round" paint-order="stroke" font-family="Inter, &quot;Inter Tight&quot;, system-ui, sans-serif" font-size="12">ciphertext + vectors</text></g><g><defs><marker id="wal-async-r2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#98EFDD" stroke-width="1.5"></path></marker></defs><line x1="690" y1="176" x2="690" y2="208" stroke="#98EFDD" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#wal-async-r2)"></line></g></svg>
