<svg width="880" height="420" viewBox="0 0 880 420" role="img" xmlns="http://www.w3.org/2000/svg" data-c4-level="L3" style="background: rgb(0, 0, 0); font-family: Inter, &quot;Inter Tight&quot;, system-ui, sans-serif; max-width: 100%; height: auto;"><title>Upload relay flow</title><desc>A client sends a blob and tip to the upload relay, which encodes and distributes slivers and returns a certificate; the client registers and certifies the blob on Sui itself.</desc><g style="opacity: 1; transition: opacity 0.3s;"><g><rect x="20" y="158" width="132" height="56" fill="#613DFF"></rect><text x="86" y="181.52" fill="#FAF8F5" text-anchor="middle" dominant-baseline="central" font-family="Inter, &quot;Inter Tight&quot;, system-ui, sans-serif" font-size="14" font-weight="500" letter-spacing="0.5">CLIENT</text><text x="86" y="198.32" fill="#98EFDD" text-anchor="middle" dominant-baseline="central" font-family="Inter, &quot;Inter Tight&quot;, system-ui, sans-serif" font-size="12">browser / app</text></g></g><g style="opacity: 1; transition: opacity 0.3s;"><g><polygon points="300,126 364,190 300,254 236,190" fill="#613DFF"></polygon><text x="300" y="190" fill="#FAF8F5" text-anchor="middle" dominant-baseline="central" font-family="Inter, &quot;Inter Tight&quot;, system-ui, sans-serif" font-size="13" font-weight="500" letter-spacing="0.5">IN-BROWSER?</text></g></g><g style="opacity: 1; transition: opacity 0.3s;"><g><rect x="430" y="158" width="150" height="56" fill="#CAB1FF"></rect><text x="505" y="181.52" fill="#000000" text-anchor="middle" dominant-baseline="central" font-family="Inter, &quot;Inter Tight&quot;, system-ui, sans-serif" font-size="14" font-weight="500" letter-spacing="0.5">UPLOAD RELAY</text><text x="505" y="198.32" fill="#000000" text-anchor="middle" dominant-baseline="central" font-family="Inter, &quot;Inter Tight&quot;, system-ui, sans-serif" font-size="12">encode + fan out</text></g></g><g style="opacity: 1; transition: opacity 0.3s;"><g><g><rect x="704.66666666