</g><g style="opacity: 1; transition: opacity 0.3s;"><g><defs><marker id="wal-sync-r0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#98EFDD"></path></marker></defs><line x1="152" y1="190" x2="236" y2="190" stroke="#98EFDD" stroke-width="1.5" marker-end="url(#wal-sync-r0)"></line></g></g><g style="opacity: 1; transition: opacity 0.3s;"><g><defs><marker id="wal-sync-r1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#98EFDD"></path></marker></defs><line x1="364" y1="190" x2="430" y2="190" stroke="#98EFDD" stroke-width="1.5" marker-end="url(#wal-sync-r1)"></line><text x="397" y="182" fill="#98EFDD" text-anchor="middle" stroke="#000000" stroke-width="4" stroke-linejoin="round" paint-order="stroke" font-family="Inter, &quot;Inter Tight&quot;, system-ui, sans-serif" font-size="12">too heavy</text></g></g><g style="opacity: 1; transition: opacity 0.3s;"><g><defs><marker id="wal-sync-r2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#98EFDD"></path></marker></defs><path d="M 580 185 V 96 H 697 V 96" fill="none" stroke="#98EFDD" stroke-width="1.5" marker-end="url(#wal-sync-r2)"></path><text x="638.5" y="90" fill="#98EFDD" text-anchor="middle" stroke="#000000" stroke-width="4" stroke-linejoin="round" paint-order="stroke" font-family="Inter, &quot;Inter Tight&quot;, system-ui, sans-serif" font-size="12">distribute slivers</text></g></g><g style="opacity: 1; transition: opacity 0.3s;"><g><defs><marker id="wal-async-r3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#98EFDD" stroke-width="1.5"></path></marker></defs><line x1="697" y1="193" x2="582" y2="193" stroke="#98EFDD" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#wal-async-r3)"></line><text x="639.5" y="185" fill="#98EFDD" text-anchor="middle" stroke="#000000" stroke-width="4" stroke-linejoin="round" paint-order="stroke" font-family="Inter, &quot;Inter Tight&quot;, system-ui, sans-serif" font-size="12">confirmations</text></g></g><g style="opacity: 1; transition: opacity 0.3s;"><g><defs><marker id="wal-async-r4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#98EFDD" stroke-width="1.5"></path></marker></defs><path d="M 505 222 V 288 H 86 V 222" fill="none" stroke="#98EFDD" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#wal-async-r4)"></path><text x="295.5" y="282" fill="#98EFDD" text-anchor="middle" stroke="#000000" stroke-width="4" stroke-linejoin="round" paint-order="stroke" font-family="Inter, &quot;Inter Tight&quot;, system-ui, sans-serif" font-size="12">certificate</text></g></g><g style="opacity: 1; transition: opacity 0.3s;"><g><defs><marker id="wal-sync-r5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#98EFDD"></path></marker></defs><path d="M 110 222 V 350 H 648 V 350" fill="none" stroke="#98EFDD" stroke-width="1.5" marker-end="url(#wal-sync-r5)"></path><text x="379" y="344" fill="#98EFDD" text-anchor="middle" stroke="#000000" stroke-width="4" stroke-linejoin="round" paint-order="stroke" font-family="Inter, &quot;Inter Tight&quot;, system-ui, sans-serif" font-size="12">client registers + pays</text></g></g><g><circle r="3.2" fill="#16D6C4" opacity="0.9"><animateMotion dur="1.5s" begin="0s" repeatCount="indefinite" path="M110 222 L110 350 L648 350"></animateMotion><animate attributeName="opacity" dur="1.5s" begin="0s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.1;0.85;1"></animate></circle><circle r="3.2" fill="#16D6C4" opacity="0.9"><animateMotion dur="1.5s" begin="0.5s" repeatCount="indefinite" pa