<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Walrus Docs have moved</title>
<link rel="canonical" href="https://docs.wal.app/">
<meta name="robots" content="noindex">
<script>
  // Keep the path so old links land on the matching page; docs.wal.app redirects legacy paths.
  var path = location.pathname.replace(/^\/walrus(?=\/|$)/, "") || "/";
  location.replace("https://docs.wal.app" + path + location.search + location.hash);
</script>
<noscript><meta http-equiv="refresh" content="0; url=https://docs.wal.app/"></noscript>
</head>
<body>
<p>The Walrus documentation has moved to <a href="https://docs.wal.app/">docs.wal.app</a>.</p>
</body>
</html>
