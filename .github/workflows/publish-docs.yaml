name: Build docs and publish to GitHub Pages and Walrus

on:
  push:
    branches:
      - "main"
    paths:
      - "docs/**"
      - ".github/workflows/publish-docs.yaml"
  repository_dispatch:
    types: [memwal-docs-updated, oyster-docs-updated]
  workflow_dispatch:
    inputs:
      publish-pages:
        description: "Publish to GitHub Pages"
        type: boolean
        required: true
        default: false
      update-walrus-site:
        description: "Update the Walrus Site"
        type: boolean
        required: true
        default: false
  schedule:
    # Rebuild daily to pick up upstream Walrus Memory and Walrus Oyster API doc changes.
    - cron: "14 3 * * *"

concurrency: ci-${{ github.ref }}

permissions:
  contents: read

jobs:
  publish-github-pages:
    name: Publish to GitHub Pages
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || inputs.publish-pages == true }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # pin@v6.0.10
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # pin@v7.0.0
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: docs/site/pnpm-lock.yaml
      - name: Install dependencies
        run: cd docs/site && pnpm install --frozen-lockfile
      - name: Build site
        run: cd docs/site && pnpm run build
      - name: Check route config
        run: cd docs/site && ./check-routes.sh
      - name: Update GitHub Pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # pin@v4.9.0
        with:
          folder: docs/site/build
          clean-exclude: pr-preview/
          force: false

  # We store the data for the Sui wallet and the site object in GitHub variables
  # (https://github.com/MystenLabs/walrus/settings/variables/actions) and secrets
  # (https://github.com/MystenLabs/walrus/settings/secrets/actions).
  publish-walrus:
    name: Update Walrus Site
    runs-on: ubuntu-ghcloud
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || inputs.update-walrus-site == true }}
    concurrency:
      group: sui-wallet-operations
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # pin@v6.0.10
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # pin@v7.0.0
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: docs/site/pnpm-lock.yaml
      - name: Install dependencies
        run: cd docs/site && pnpm install --frozen-lockfile
      - name: Build site
        run: cd docs/site && pnpm run build
      - name: Check route config
        run: cd docs/site && ./check-routes.sh
      - name: Deploy to Walrus
        uses: MystenLabs/walrus-sites-github-actions/deploy@6cac4a54984385a9c00b35d80d5a5c15a69f10e9 # v4
        with:
          SUI_ADDRESS: "${{ vars.SUI_ADDRESS }}"
          SUI_KEYSTORE: "${{ secrets.SUI_KEYSTORE }}"
          WALRUS_CONFIG: "${{ vars.WALRUS_CONFIG }}"
          SUI_NETWORK: mainnet
          DIST: docs/site/build
          WS_RESOURCES: docs/site/ws-resources.json
          EPOCHS: "10"
          GAS_BUDGET: "2000000000"
          SITE_BUILDER_VERSION: v2
      - name: Wait for deployment to propagate
        run: sleep 60
      - name: Test markdown routes
        run: |
          cd docs/site && ./ping-test.sh https://docs.wal.app/docs/getting-started.md --retries 12 --delay 20
