name: Build and publish docs

on:
  push:
    branches:
      - "main"
    paths:
      - "docs/**"
      - ".github/workflows/publish-docs.yaml"
  repository_dispatch:
    types: [memwal-docs-updated, oyster-docs-updated]
  workflow_dispatch:
  schedule:
    # Rebuild daily to pick up upstream Walrus Memory and Walrus Oyster API doc changes.
    - cron: "14 3 * * *"

concurrency: ci-${{ github.ref }}

permissions:
  contents: read

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # pin@v6.0.9
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # pin@v7.0.0
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: docs/site/pnpm-lock.yaml
      - name: Install dependencies
        run: cd docs/site && pnpm install --frozen-lockfile
      - name: Build site
        run: cd docs/site && pnpm run build

  # Vercel handles production deployments automatically via its Git
  # integration (push to main triggers a deploy). This workflow only
  # needs to verify the build succeeds. The daily schedule and
  # repository_dispatch triggers ensure Vercel rebuilds when upstream
  # content (Walrus Memory, Oyster) changes.
  #
  # To trigger a Vercel redeploy from CI without Vercel's Git integration,
  # add a deploy hook URL as a repository secret and uncomment:
  #
  # deploy:
  #   name: Trigger Vercel deploy
  #   needs: build
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Trigger Vercel deploy hook
  #       run: curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
