name: Lint

on: [pull_request]

permissions:
  contents: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    name: Check PR title format
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
        with:
          fetch-depth: 0
      - name: Check PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # pin@v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  formatting:
    runs-on: ubuntu-latest
    name: Check formatting
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # pin@v7.0.0
        with:
          python-version: "3.x"

      - name: Install and run editorconfig-checker
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install editorconfig-checker=="2.7.3"
          ec

      - name: Install taplo
        run: |
          url="https://github.com/tamasfe/taplo/releases/download/0.10.0/taplo-linux-x86_64.gz"
          curl -sSL "$url" | gunzip > taplo
          chmod +x taplo
      - name: Check formatting of all TOML files
        run: ./taplo format --check

      - name: Check for leftover crumbs
        run: |
          count_of_crumbs="$(git grep crumb! | grep -Ev -e '^crates/walrus-utils/src/lib.rs' -e '^\.github/workflows/lint.yml' | wc -l)"
          test "$count_of_crumbs" -eq 0

      - name: Install yamlfmt
        run: |
          url="https://github.com/google/yamlfmt/releases/download/v0.17.0/yamlfmt_0.17.0_Linux_x86_64.tar.gz"
          curl -sSL "$url" | tar xvz yamlfmt
      - name: Check formatting of all YAML files
        run: ./yamlfmt -lint

      - name: Lint all markdown files
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # pin@v24.2.0
        with:
          config: .markdownlint-cli2.yaml
          # Note: Keep globs in sync with .markdownlint-cli2.yaml.
          globs: "README.md CONTRIBUTING.md"

  move-formatting:
    name: Check Move formatting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # pin@v7.0.0
      - run: npm install @mysten/prettier-plugin-move@0.3.0
      - run: npx prettier-move -c **/*.move

  typos:
    runs-on: ubuntu-latest
    name: Check spelling
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
      - uses: crate-ci/typos@8a48f81b6c64dcfea44b3633223084c4be58ac5f # pin@v1.49.0

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
      - name: Run ShellCheck
        run: find . -type f -name "*.sh" -exec shellcheck --severity=error {} +

  license-headers:
    runs-on: ubuntu-latest
    name: Check license headers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
      - name: Install licensesnip
        uses: taiki-e/install-action@a2352fc6ce487f030a3aa709482d57823eadfb37 # pin@v2.75.16
        with:
          tool: licensesnip@1.7.0
      - run: licensesnip check

  network-reference:
    runs-on: ubuntu-latest
    name: Check Network Reference is up to date
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # pin@v7.0.0
        with:
          python-version: "3.x"
      - name: Check for drift between the canonical sources and the page
        # Regenerates the volatile blocks of docs/content/network-reference.mdx
        # from setup/client_config.yaml, mainnet-contracts/*/Published.toml, and
        # scripts/network_reference_data.yaml, and fails if the page is stale.
        run: python3 scripts/generate_network_reference.py --check

  diagram-fallbacks:
    runs-on: ubuntu-latest
    name: Check interactive diagram fallback assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
        with:
          fetch-depth: 0
      - name: Check that changed interactive diagrams ship their fallback assets
        # Asserts that every added or modified interactive_*.html diagram has
        # its sibling .svg and .png fallback assets in the same directory. See
        # docs/site/README.md, "Interactive diagram fallback assets".
        run: |
          node docs/site/src/scripts/check-diagram-fallbacks.mjs \
            --base "origin/${{ github.base_ref }}"

  check-all:
    name: Check if all lint jobs succeeded
    if: always()
    needs:
      - pr-title
      - formatting
      - move-formatting
      - typos
      - license-headers
      - network-reference
      - diagram-fallbacks
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether all needed jobs succeeded
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # pin@v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
