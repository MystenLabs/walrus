name: Build docs for PRs

# Previews come from Vercel now, through its Git integration, the same way
# production does since the migration in #3762. What is left here is the
# build itself, which is worth running on its own: onBrokenLinks is set to
# throw, so a link to a page that does not exist fails this job.
#
# Removed with the GitHub Pages deployment:
#   preview       pushed docs/site/build to gh-pages via pr-preview-action.
#                 Pages is gone, so every run of it failed on every docs PR.
#   afdocs-check  waited for that Pages deployment and ran afdocs against
#                 MystenLabs.github.io/walrus/pr-preview/pr-N. It cannot
#                 work without the Pages URL. The daily afdocs run against
#                 docs.wal.app still covers the merged site.

on:
  pull_request:
    # No `closed`: that was here so the preview job could delete the PR's
    # directory from gh-pages when it closed. A build has nothing to clean up.
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - "docs/**"
      - ".github/workflows/pages-preview.yaml"

concurrency: docs-build-${{ github.ref }}

# Write access was for pushing to gh-pages and commenting the preview URL.
# A build needs neither.
permissions:
  contents: read

jobs:
  build-with-linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # pin@v6.0.9
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # pin@v7.0.0
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: docs/site/pnpm-lock.yaml
      - name: Install dependencies
        run: cd docs/site && pnpm install --frozen-lockfile
      - name: Build site
        run: cd docs/site && pnpm run build
