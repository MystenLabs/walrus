name: Nightly CoinMarketCap API test

on:
  schedule:
    - cron: "17 10 * * *" # Daily at 10:17 UTC.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: short

jobs:
  coinmarketcap:
    name: Test CoinMarketCap live API
    runs-on: ubuntu-ghcloud
    timeout-minutes: 60
    env:
      OPENSSL_STATIC: "1"
      OPENSSL_NO_VENDOR: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
      - uses: taiki-e/install-action@a2352fc6ce487f030a3aa709482d57823eadfb37 # pin@v2.75.16
        with:
          tool: cargo-nextest
      - uses: ./.github/actions/sccache
        with:
          gcp_credentials_json: ${{ secrets.GCP_WALRUS_RELEASE_BUCKET_SVCUSER_CREDENTIALS }}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config zlib1g-dev libpq-dev build-essential cmake
      - name: Run CoinMarketCap live API test
        # This test is ignored in Rust and excluded by the PR CI profile; opt into both here.
        run: >-
          cargo nextest run -p walrus-service --lib --features backup
          --profile ci --cargo-profile test-opt --run-ignored only --ignore-default-filter
          -E 'test(=node::wal_price_monitor::tests::test_fetch_from_coinmarketcap)'
